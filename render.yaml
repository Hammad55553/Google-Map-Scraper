services:
  - type: web
    name: lead-gen-backend
    env: python
    buildCommand: "cd frontend/api && pip install -r requirements.txt && playwright install chromium --with-deps"
    startCommand: "cd frontend/api && uvicorn index:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: DATABASE_URL
        sync: false
