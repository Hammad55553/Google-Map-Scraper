services:
  - type: web
    name: lead-gen-backend
    env: python
    rootDir: frontend/api
    buildCommand: "pip install -r requirements.txt && playwright install chromium"
    startCommand: "uvicorn index:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PLAYWRIGHT_BROWSERS_PATH
        value: "0"
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: DATABASE_URL
        sync: false
